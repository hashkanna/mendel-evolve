[project]
name = "mendel"
version = "0.1.0"
description = "MendelEvolve: genetics for algorithm discovery. Evolve ideas, not programs, and measure what each idea is worth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "optuna>=3.6",
    "scipy>=1.13",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]
api = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
mendel = "mendel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mendel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
