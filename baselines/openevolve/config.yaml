# OpenEvolve baseline for circle packing (n = 26), for the head-to-head against Mendel.
#
# This is OpenEvolve's own examples/circle_packing/config_phase_1_anthropic.yaml with two changes:
#   * one model, claude-haiku-4-5, instead of the Sonnet/Opus pair (same endpoint and key variable);
#   * checkpoint_interval 1 instead of 10, so that every best-so-far program is on disk.
# Everything else is left as shipped: the system message, the population settings, the evaluator
# settings and full rewrites. One phase only: the example's second config
# (config_phase_2*.yaml, a different system message applied after a plateau) is not used.
#
# run_openevolve.py rewrites the three lines marked "set by the runner" for each run.
# Sampling parameters sent: temperature 0.7 and max_tokens 8192, plus OpenEvolve's `seed` field,
# which the endpoint ignores. top_p is not set, as in the shipped Anthropic config.

max_iterations: 100        # set by the runner (--iterations)
checkpoint_interval: 1     # set by the runner (--checkpoint-interval)
random_seed: 42            # set by the runner (--seed)
log_level: "INFO"

# LLM configuration
llm:
  primary_model: "claude-haiku-4-5"
  primary_model_weight: 1.0
  api_base: "https://api.anthropic.com/v1"
  api_key: "${ANTHROPIC_API_KEY}"
  temperature: 0.7
  max_tokens: 8192
  timeout: 600

# Prompt configuration (system message verbatim from the shipped phase 1 config)
prompt:
  system_message: |
    You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635 for n=26.

    Key geometric insights:
    - Circle packings often follow hexagonal patterns in the densest regions
    - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ≈ 0.9069
    - Edge effects make square container packing harder than infinite packing
    - Circles can be placed in layers or shells when confined to a square
    - Similar radius circles often form regular patterns, while varied radii allow better space utilization
    - Perfect symmetry may not yield the optimal packing due to edge effects

    Focus on designing an explicit constructor that places each circle in a specific position, rather than an iterative search algorithm.
  num_top_programs: 3
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 60
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.75]
  parallel_evaluations: 4
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: false
allow_full_rewrites: true
