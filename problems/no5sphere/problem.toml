name = "no5sphere"
title = "No 5 on a sphere (Tao et al., problem 60)"
direction = "max"
statement = """
For a natural number n, let C(n) be the size of the largest subset of the grid {0, ..., n-1}^3 in which
no 5 points lie on a common sphere or on a common plane. Find subsets that are as large as possible.

An instance is {"n": n}. A solution is a list of [x, y, z] integer triples with 0 <= x, y, z < n
(0-based coordinates), all distinct. Its score is the number of points; higher is better.

Five points are forbidden exactly when the 5x5 integer determinant with rows
[x, y, z, x^2 + y^2 + z^2, 1] is zero (a plane is the degenerate sphere). The evaluator checks every
5-subset in exact integer arithmetic, so a set that is "almost" valid scores nothing.

Facts worth knowing:
- Each plane z = c holds at most 4 points, so C(n) <= 4n. The best known sets have about 2.6 n points.
- A set with at least 5 points can contain 3 collinear points, but never 4 points on a common circle or line:
  any fifth point would then be cospherical or coplanar with them.
- Four points in general position determine one sphere (or plane); every other grid point on it is blocked.
  Translating one point to the origin, five points are forbidden iff the four lifted vectors
  (dx, dy, dz, dx^2 + dy^2 + dz^2) are linearly dependent.
- The published record sets for n = 13 to 16 are centrosymmetric (antipodal pairs about the cube centre), and
  so are the 44-point sets for n = 17; the records for n = 7 to 12 and for n >= 17 are not.
- Published records come from exact local search (ruin-and-recreate, tabu), not from algebraic constructions.

Source: Georgiev, Gomez-Serrano, Tao, Wagner, "Mathematical exploration and discovery at scale",
arXiv:2511.02864, section 6.40; https://google-deepmind.github.io/alphaevolve_repository_of_problems/problems/60.html
The original statement uses {1, ..., n}^3; coordinates here are shifted to start at 0.
"""

[instances]
train   = [{ n = 10 }, { n = 12 }, { n = 14 }, { n = 16 }]
heldout = [{ n = 18 }, { n = 20 }, { n = 22 }, { n = 24 }]

# Best published lower bounds, each re-verified with evaluate.py against the published point set
