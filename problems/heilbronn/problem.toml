name = "heilbronn"
title = "Heilbronn triangle problems: square, triangle, convex region (Tao et al., problems 48 and 49)"
direction = "max"
statement = """
Place n points in a region so that the smallest triangle formed by any three of them is as large as
possible. Three variants, selected by the instance's "shape":

  square    points in the unit square 0 <= x, y <= 1.            value = smallest triangle area
  triangle  points in the right triangle x >= 0, y >= 0,         value = 2 * smallest triangle area
            x + y <= 1 (area 1/2; every triangle is an affine      (the smallest area as a fraction of
            image of it, and area ratios are affine invariant)      the region's area)
  convex    points anywhere in the plane; the region is their    value = smallest triangle area divided
            own convex hull.                                       by the area of the convex hull

An instance is {"shape": "square" | "triangle" | "convex", "n": n}. A solution is a list of n points,
each a pair [x, y] of decimal strings, for example ["0.25", "0.903400000000000017"]: plain decimal
literals, at most 6 digits before the point and 200 after, no exponents. Each literal is read as the exact
rational it denotes. The points must be distinct and lie in the region; boundary points are allowed.
Containment and all C(n, 3) triangle areas are evaluated in exact arithmetic with no tolerance, exactly as
the public leaderboard does (https://github.com/tejstead/heilbronn-site), so a point outside the region
by 1e-30 is invalid, and the score is the exact value rounded once to a double. Higher is better.

Facts worth knowing:
- It is a max-min problem over all triples. At a local optimum many triangles tie for the minimum
  (about 2n of them for n points), and the configuration is the solution of that tie system.
- The sign (orientation) of every triple is fixed along any path that keeps all areas positive, so a
  local method never leaves the order type of its starting configuration: the global search is a search
  over order types.
- A twice-area cross product is bilinear in the coordinates, so the linearisation of every area
  constraint around a configuration is exact up to a term quadratic in the step.
- Many leaderboard entries are symmetric: for the square 180-degree (C2) or 90-degree (C4) rotations
  about the centre and mirror lines; for the triangle the affine 3-fold map (x, y) -> (y, 1 - x - y) and
  the mirror (x, y) -> (y, x); for convex regions dihedral groups. Many others (n = 29, 31, 33 to 36 in
  the square) have no symmetry at all.
- Leaderboard entries for n >= 27 were found by basin hopping with symmetry reduction, by deleting one
  point from the record for n + 1 and re-optimising, and by annealing; they changed by 1.65% to 9% in
  September 2026, so they are unlikely to be optimal. Entries for n <= 16 look saturated.

Sources: Georgiev, Gomez-Serrano, Tao, Wagner, "Mathematical exploration and discovery at scale",
arXiv:2511.02864; https://google-deepmind.github.io/alphaevolve_repository_of_problems/ (problems 48, 49);
leaderboard and verification rules: https://math.tejstead.com/heilbronn.
"""

[instances]
# Ideas are selected where the records are thought to be soft, one size per variant, and tested for
# generality on sizes they never saw.
train   = [{ shape = "square", n = 30 }, { shape = "triangle", n = 30 }, { shape = "convex", n = 30 }]
heldout = [{ shape = "square", n = 27 }, { shape = "triangle", n = 33 }, { shape = "convex", n = 35 }, { shape = "square", n = 36 }]
# Small instances for the invariance gate: one per variant, because each has its own code path.
gate    = [{ shape = "square", n = 8 }, { shape = "triangle", n = 8 }, { shape = "convex", n = 8 }]

# Leaderboard values (data/canonical at commit c2378d4, read 2026-10-03T19:22Z), each reproduced exactly
# from its published point set by evaluate.py and verify.py. These are the exact values rounded to the
# nearest double; the exact fractions and 30-digit decimals are in records.json. The leaderboard has no
# entry for the triangle or the convex variant at n = 36.
